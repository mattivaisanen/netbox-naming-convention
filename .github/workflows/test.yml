name: Test

# Pull requests only (a merge to main was already tested as its PR), and two
# jobs rather than four, to save Actions minutes.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release on its own, and the latest tested one
        # next to netbox-change-approval.
        include:
          - netbox: v4.7.0
            plugins: none
          - netbox: v4.7.3
            plugins: all
    env:
      NETBOX_REF: ${{ matrix.netbox }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out this plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out NetBox
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ env.NETBOX_REF }}
          path: netbox

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NetBox + plugin
        run: |
          pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -e plugin

      - name: Install optional plugins
        if: matrix.plugins == 'all'
        run: |
          pip install git+https://github.com/mattivaisanen/netbox-change-approval.git@28b5eb350f200a9818aafc7330335d73218a8c62  # release 0.3.3

      - name: Configure NetBox
        env:
          PLUGIN_SET: ${{ matrix.plugins }}
        run: |
          if [ "$PLUGIN_SET" = "all" ]; then
            PLUGINS="['netbox_naming_convention', 'netbox_change_approval']"
          else
            PLUGINS="['netbox_naming_convention']"
          fi
          cat > netbox/netbox/netbox/configuration.py << PYEOF
          ALLOWED_HOSTS = ['*']
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': 'netbox', 'USER': 'netbox', 'PASSWORD': 'netbox',
                  'HOST': 'localhost', 'PORT': '5432',
              },
          }
          REDIS = {
              'tasks': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 0, 'SSL': False},
              'caching': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 1, 'SSL': False},
          }
          SECRET_KEY = 'ci-only-secret-key-' + 'x' * 40
          API_TOKEN_PEPPERS = {1: 'ci-only-pepper-' + 'y' * 40}
          PLUGINS = ${PLUGINS}
          PYEOF

      - name: Run migrations
        working-directory: netbox/netbox
        run: python manage.py migrate

      - name: Collect static files
        working-directory: netbox/netbox
        run: python manage.py collectstatic --no-input

      - name: Check for migration drift
        working-directory: netbox/netbox
        run: python manage.py makemigrations netbox_naming_convention --check --dry-run

      - name: Run plugin test suite
        working-directory: netbox/netbox
        run: python manage.py test netbox_naming_convention
