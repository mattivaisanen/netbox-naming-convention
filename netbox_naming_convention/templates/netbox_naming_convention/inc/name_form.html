{% load i18n %}
{# Device, virtual machine and rack add/edit form helper. See DEVELOPER.md "The name field". #}
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var MODE = '{{ naming_mode|escapejs }}';
  var TYPE = '{{ naming_type|escapejs }}';
  var OBJECT = '{{ naming_object|escapejs }}';
  // The form's fields the name can depend on, and those a rule needs to match at all.
  var FIELDS = JSON.parse('{{ naming_fields_json|escapejs }}');
  var KIND_FIELDS = JSON.parse('{{ naming_kind_fields_json|escapejs }}');
  var URL = '{{ naming_url|escapejs }}';
  var LOCKED = '{{ naming_locked|escapejs }}' === 'yes';
  var TEXT = {
    edit: '{{ _("Type a name yourself")|escapejs }}',
    lock: '{{ _("Use the name from the rule")|escapejs }}',
    again: '{{ _("Suggest again")|escapejs }}',
    rule: '{{ _("Naming convention")|escapejs }}',
    pattern: '{{ _("Names look like")|escapejs }}',
    suggested: '{{ _("Suggested name")|escapejs }}',
    waiting: '{{ _("Filled in once set")|escapejs }}',
    confirmed: '{{ _("The number is confirmed when you save.")|escapejs }}',
    kind: '{{ _("Filled in once a naming rule matches what you choose below.")|escapejs }}',
    typing: '{{ _("You are typing your own name.")|escapejs }}',
    parent: '{{ _("parent")|escapejs }}'
  };

  // What a missing value is called on this form: "rack" -> "Rack",
  // "role.parent" -> "Device role (parent)".
  function labelFor(key) {
    var parts = key.split('.');
    // TomSelect moves a select's label to its own control (id_rack-ts-control).
    var label = document.querySelector('label[for="id_' + parts[0] + '"]') ||
                document.querySelector('label[for="id_' + parts[0] + '-ts-control"]');
    var text = label ? label.textContent.replace(/\*/g, '').trim() : parts[0];
    var rest = parts.slice(1);
    if (rest.length && rest.every(function (p) { return p === 'parent'; })) { return text + ' (' + TEXT.parent + ')'; }
    return rest.length ? text + ' ' + rest.join('.') : text;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  // The pattern with missing values shown as muted placeholders.
  function patternNode(pattern) {
    var code = el('span', 'font-monospace');
    pattern.split(/<([^<>]+)>/).forEach(function (piece, i) {
      if (i % 2) {
        code.appendChild(el('span', 'text-secondary fst-italic', '[' + labelFor(piece) + ']'));
      } else if (piece) {
        code.appendChild(document.createTextNode(piece));
      }
    });
    return code;
  }

  // Lines under the name field: [label, text or node], or a plain string.
  function setNote(lines) {
    note.textContent = '';
    lines.forEach(function (line) {
      var row = el('div');
      if (typeof line === 'string') {
        row.textContent = line;
      } else {
        row.appendChild(el('span', 'text-secondary', line[0] + ': '));
        row.appendChild(typeof line[1] === 'string' ? el('span', '', line[1]) : line[1]);
      }
      note.appendChild(row);
    });
  }

  function about() {
    var lines = [[TEXT.rule, last.rule.name]];
    if (last.pattern) { lines.push([TEXT.pattern, patternNode(last.pattern)]); }
    return lines;
  }

  function waitingLine(missing) {
    return [TEXT.waiting, (missing || last.missing).map(labelFor).join(', ')];
  }

  function suggestedLine() {
    return [TEXT.suggested, el('span', 'font-monospace', last.name)];
  }

  var input = document.getElementById('id_name');
  if (!input || !input.form) { return; }
  var form = input.form;
  var cookie = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
  var token = cookie ? decodeURIComponent(cookie[1]) : '{{ csrf_token|escapejs }}';

  // The name field with its buttons and note. attach() builds them, and
  // builds them again when NetBox redraws the form's fields (choosing a
  // virtual machine type reloads them through HTMX).
  var group, again, button, note;
  function attach() {
    group = el('div', 'input-group');
    input.parentNode.insertBefore(group, input);
    group.appendChild(input);
    again = el('button', 'btn btn-outline-primary', TEXT.again);
    again.type = 'button';
    again.hidden = true;
    group.appendChild(again);
    button = el('button', 'btn btn-outline-secondary');
    button.type = 'button';
    button.hidden = true;
    group.appendChild(button);
    note = el('div', 'form-text');
    group.parentNode.insertBefore(note, group.nextSibling);
    button.addEventListener('click', toggle);
    again.addEventListener('click', suggestAgain);
    input.addEventListener('input', typed);
  }

  // Add: the name starts locked (grayed, filled in by the rule) unless the
  // form came back with a name typed in. Edit: locked when the name follows
  // its rule (the server says so).
  var locked = MODE === 'add' ? !input.value : LOCKED;
  var keep = input.value;  // edit: the name a re-lock goes back to
  var original = input.value;  // edit: the name the object has
  var last = null;
  var lastSent = null;
  var first = true;
  var timer = null;

  function values() {
    var data = new FormData(form);
    var out = {object_type: TYPE};
    FIELDS.forEach(function (key) {
      var value = data.get(key);
      if (value !== null && value !== '') {
        out[key] = value;
      } else if (form.elements[key]) {
        // Cleared: say so, or the edit form's suggestion keeps the saved value.
        out[key] = null;
      }
    });
    out.tags = data.getAll('tags').filter(function (v) { return v !== ''; }).map(Number);
    var cf = {};
    data.forEach(function (value, key) {
      if (key.indexOf('cf_') === 0 && value !== '') { cf[key.slice(3)] = value; }
    });
    out.custom_fields = cf;
    // Edit: suggest from the name the object has, not from what is typed, so
    // an object that stays in its series keeps its number.
    if (OBJECT) { out.id = Number(OBJECT); out.name = original; }
    return out;
  }

  function setIcon(name, title) {
    button.textContent = '';
    var icon = document.createElement('i');
    icon.className = 'mdi ' + name;
    button.appendChild(icon);
    button.title = title;
    button.setAttribute('aria-label', title);
    button.hidden = false;
  }

  function hidden(name, value) {
    var el = document.createElement('input');
    el.type = 'hidden';
    el.name = name;
    el.value = value;
    return el;
  }
  // Add: sent with a name the rule filled in, so the server picks its number
  // again at save instead of treating it as typed (signals.py).
  var marker = hidden('_naming_auto', '1');
  // Edit: the name "Suggest again" put in, so the change shows it came from
  // the rule.
  var accepted = hidden('_naming_suggested', '');

  function lock(on) {
    input.readOnly = on;
    input.style.backgroundColor = on ? 'var(--tblr-secondary-bg, #e5e7eb)' : '';
    input.style.color = on ? 'var(--tblr-secondary, #6b7280)' : '';
    if (MODE === 'add') {
      if (on && !marker.parentNode) { form.appendChild(marker); }
      if (!on && marker.parentNode) { marker.parentNode.removeChild(marker); }
    }
  }

  // What the form still lacks before a rule can name the object, as a note
  // line, or null. Kinds with fields every rule needs (a device's site, role
  // and device type) wait for those, and say which are missing; other kinds
  // wait until anything is chosen (the status has a default, so it doesn't
  // count). Clearing a field again makes the name wait again.
  function missingNote() {
    var data = new FormData(form);
    if (KIND_FIELDS.length) {
      var missing = KIND_FIELDS.filter(function (key) { return form.elements[key] && !data.get(key); });
      return missing.length ? waitingLine(missing) : null;
    }
    var chosen = FIELDS.some(function (key) { return key !== 'status' && !!data.get(key); });
    return chosen ? null : TEXT.kind;
  }

  function showAdd() {
    var rule = last && last.rule;
    again.hidden = true;
    if (!rule) {
      var waiting = missingNote();
      if (locked && waiting) {
        // Not enough to go on (yet, or again after a field was cleared):
        // keep the field for the rule.
        lock(true);
        input.value = '';
        setNote([waiting]);
        setIcon('mdi-pencil', TEXT.edit);
        return;
      }
      // No rule for this object: the name field as NetBox has it.
      if (locked) { input.value = ''; }
      lock(false);
      input.placeholder = '';
      button.hidden = true;
      setNote([]);
      return;
    }
    if (locked) {
      lock(true);
      input.value = last.ready ? last.name : '';
      input.placeholder = '';
      if (last.ready) {
        setNote(about().concat([TEXT.confirmed]));
      } else if (last.error) {
        setNote(about().concat([last.error]));
      } else {
        setNote(about().concat([waitingLine()]));
      }
      setIcon('mdi-pencil', TEXT.edit);
    } else {
      lock(false);
      input.placeholder = last.ready ? last.name : '';
      setNote([TEXT.typing].concat(about(), last.ready ? [suggestedLine()] : []));
      setIcon('mdi-lock-outline', TEXT.lock);
    }
  }

  function showEdit() {
    // Never change the name on its own: offer the rule's name.
    var rule = last && last.rule;
    lock(locked);
    if (locked) {
      input.value = keep;
      setIcon('mdi-pencil', TEXT.edit);
    } else if (rule) {
      setIcon('mdi-lock-outline', TEXT.lock);
    } else {
      button.hidden = true;
    }
    var differs = rule && last.ready && last.name !== input.value;
    again.hidden = !differs;
    if (differs) {
      setNote(about().concat([suggestedLine()]));
    } else if (rule && last.error) {
      setNote(about().concat([last.error]));
    } else if (rule && last.ready) {
      setNote(about());
    } else if (rule && last.missing.length) {
      setNote(about().concat([waitingLine()]));
    } else {
      setNote([]);
    }
  }

  function show() {
    if (MODE === 'add') { showAdd(); } else { showEdit(); }
  }

  function ask() {
    var body = JSON.stringify(values());
    if (body === lastSent) { return; }
    lastSent = body;
    fetch(URL, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json', 'X-CSRFToken': token},
      body: body
    }).then(function (response) {
      return response.ok ? response.json() : null;
    }).then(function (data) {
      if (data && body === lastSent) {
        // A form shown again after an error still holds the rule's name.
        if (MODE === 'add' && first && data.ready && input.value === data.name) { locked = true; }
        first = false;
        last = data;
        show();
      }
    }).catch(function () { /* the form works without suggestions */ });
  }

  function soon() {
    clearTimeout(timer);
    timer = setTimeout(ask, 250);
  }

  function toggle() {
    if (MODE === 'edit' && !locked) {
      // Back to the name the field had when it was locked.
      input.value = keep;
    }
    locked = !locked;
    show();
    if (!locked) { input.focus(); input.select(); }
  }
  function suggestAgain() {
    if (!last || !last.ready) { return; }
    input.value = last.name;
    keep = last.name;
    accepted.value = last.name;
    if (!accepted.parentNode) { form.appendChild(accepted); }
    locked = true;
    show();
  }
  form.addEventListener('change', function (event) {
    if (event.target !== input) { soon(); }
  });
  function typed() {
    if (!input.readOnly && MODE === 'add') { locked = false; }
    if (MODE === 'edit') { show(); }
  }
  // The form's fields were redrawn: the name field is a new one.
  document.body.addEventListener('htmx:afterSettle', function () {
    var current = document.getElementById('id_name');
    if (!current || current === input || current.form !== form) { return; }
    input = current;
    attach();
    if (last) { show(); } else { start(); }
  });
  // Selects driven by TomSelect don't always send a change event the form
  // sees; look for changed values now and then too.
  setInterval(ask, 1500);
  function start() {
    if (locked) { lock(true); }
    if (MODE === 'add' && locked) {
      var waiting = missingNote();
      setNote(waiting ? [waiting] : []);
      setIcon('mdi-pencil', TEXT.edit);
    }
  }
  attach();
  start();
  ask();
});
</script>
